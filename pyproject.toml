[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redline"
version = "0.1.0"
description = "Deterministic, zero-dependency safety firewall and Agent Skill for AI coding agents"
readme = "README.md"
authors = [
    { name = "AryaMehr Namdary", email = "darklegend1380@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "claude-code",
    "agent-skills",
    "mcp",
    "security",
    "ai-agents",
    "guardrails",
    "antigravity",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
redline = "agent_redline.cli:main"
guard = "agent_redline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_redline = ["presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
